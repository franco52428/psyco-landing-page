<svg width="1500" height="1450" viewBox="0 0 1500 1450" xmlns="http://www.w3.org/2000/svg" style="background-color: #FFFFFF; font-family: 'Inter', system-ui, sans-serif;">
  <defs>
    <!-- Degradados Temáticos -->
    <linearGradient id="gAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="gVerd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gMind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gInsight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gHuman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="gFusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="brandGradient45" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="brandGradient0" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <!-- Gradientes de Tarjeta para Fondo Claro -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <g id="spark">
      <path d="M 50 0 Q 50 50 100 50 Q 50 50 50 100 Q 50 50 0 50 Q 50 50 50 0 Z" />
    </g>
    <style>
      .title { font-size: 36px; font-weight: 800; fill: #0F172A; text-anchor: middle; letter-spacing: -1px; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #64748B; text-anchor: middle; }
      .label { font-size: 14px; font-weight: 600; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <!-- Título y Subtítulo -->
  <text x="750" y="80" class="title">VERDME: 22 VISIONES</text>
  <text x="750" y="120" class="subtitle">(Mente, IA, Gestión y Profundidad)</text>

  <!-- FILA 1 -->
  <!-- 1. Cerebro Digital -->
  <g transform="translate(150, 200)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 20 60 C 20 20, 80 20, 80 60 C 80 80, 50 100, 50 100 C 50 100, 20 80, 20 60" fill="none" stroke="url(#gMind)" stroke-width="12" stroke-linecap="round" />
    <use href="#spark" x="40" y="5" transform="scale(0.4)" fill="url(#gAI)" />
    <text x="50" y="140" class="label">1. Cerebro Copiloto</text>
  </g>

  <!-- 2. Nodos V -->
  <g transform="translate(400, 200)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 10 30 L 50 90 L 90 30" fill="none" stroke="url(#gAI)" stroke-width="6" />
    <circle cx="10" cy="30" r="12" fill="url(#gMind)" />
    <circle cx="50" cy="90" r="16" fill="url(#gAI)" />
    <circle cx="90" cy="30" r="12" fill="url(#gVerd)" />
    <text x="50" y="140" class="label">2. Nodos Conectados</text>
  </g>

  <!-- 3. IA Destello V -->
  <g transform="translate(650, 200)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 10 20 L 50 90 L 90 20" fill="none" stroke="url(#gFusion)" stroke-width="14" stroke-linecap="round" />
    <use href="#spark" x="25" y="-10" transform="scale(0.5)" fill="url(#gInsight)" />
    <text x="50" y="140" class="label">3. Destello Cognitivo</text>
  </g>

  <!-- 4. Portal V -->
  <g transform="translate(900, 200)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 20 100 L 20 40 C 20 10, 80 10, 80 40 L 80 100" fill="none" stroke="url(#gMind)" stroke-width="12" />
    <use href="#spark" x="35" y="40" transform="scale(0.3)" fill="url(#gInsight)" />
    <text x="50" y="140" class="label">4. Portal al Ser</text>
  </g>

  <!-- 5. Lentes Intersectados -->
  <g transform="translate(1150, 200)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <circle cx="35" cy="50" r="30" fill="url(#gAI)" fill-opacity="0.6" />
    <circle cx="65" cy="50" r="30" fill="url(#gVerd)" fill-opacity="0.6" />
    <path d="M 50 30 L 50 70" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <text x="50" y="140" class="label">5. Lentes de Enfoque</text>
  </g>

  <!-- FILA 2 -->
  <!-- 6. Faro / Luz -->
  <g transform="translate(150, 440)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 50 90 L 10 20 L 90 20 Z" fill="url(#gInsight)" fill-opacity="0.2" stroke="url(#gInsight)" stroke-width="4" />
    <circle cx="50" cy="90" r="10" fill="url(#gMind)" />
    <text x="50" y="140" class="label">6. Luz Guía</text>
  </g>

  <!-- 7. Ondas V -->
  <g transform="translate(400, 440)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <rect x="10" y="30" width="12" height="40" rx="6" fill="url(#gAI)" />
    <rect x="30" y="10" width="12" height="80" rx="6" fill="url(#gFusion)" />
    <rect x="50" y="40" width="12" height="60" rx="6" fill="url(#gMind)" />
    <rect x="70" y="20" width="12" height="50" rx="6" fill="url(#gVerd)" />
    <text x="50" y="140" class="label">7. Frecuencia V</text>
  </g>

  <!-- 8. Globos de Texto Cruzados -->
  <g transform="translate(650, 440)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 10 30 h 40 v 30 h -10 l -10 10 v -10 h -20 z" fill="url(#gMind)" />
    <path d="M 50 50 h 40 v 30 h -10 l -10 10 v -10 h -20 z" fill="url(#gVerd)" fill-opacity="0.8" />
    <text x="50" y="140" class="label">8. Diálogo Dual</text>
  </g>

  <!-- 9. Micrófono / IA -->
  <g transform="translate(900, 440)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <rect x="35" y="10" width="30" height="50" rx="15" fill="none" stroke="url(#gAI)" stroke-width="8" />
    <path d="M 20 40 A 30 30 0 0 0 80 40" fill="none" stroke="url(#gMind)" stroke-width="8" stroke-linecap="round" />
    <line x1="50" y1="70" x2="50" y2="90" stroke="url(#gMind)" stroke-width="8" />
    <text x="50" y="140" class="label">9. Escucha Activa</text>
  </g>

  <!-- 10. Eco -->
  <g transform="translate(1150, 440)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <circle cx="20" cy="50" r="10" fill="url(#gInsight)" />
    <path d="M 40 30 A 30 30 0 0 1 40 70" fill="none" stroke="url(#gAI)" stroke-width="6" stroke-linecap="round" />
    <path d="M 60 10 A 50 50 0 0 1 60 90" fill="none" stroke="url(#gMind)" stroke-width="6" stroke-linecap="round" />
    <text x="50" y="140" class="label">10. Resonancia</text>
  </g>

  <!-- FILA 3 -->
  <!-- 11. Comillas / IA -->
  <g transform="translate(150, 680)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 20 40 L 40 40 L 20 80 M 60 40 L 80 40 L 60 80" fill="none" stroke="url(#gAI)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <use href="#spark" x="50" y="-10" transform="scale(0.3)" fill="url(#gInsight)" />
    <text x="50" y="140" class="label">11. Transcripción</text>
  </g>

  <!-- 12. Figura Humana V -->
  <g transform="translate(400, 680)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <circle cx="50" cy="20" r="14" fill="url(#gHuman)" />
    <path d="M 20 90 C 20 50, 80 50, 80 90" fill="none" stroke="url(#gMind)" stroke-width="12" stroke-linecap="round" />
    <text x="50" y="140" class="label">12. Centro Humano</text>
  </g>

  <!-- 13. Loto Digital -->
  <g transform="translate(650, 680)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 50 90 C 10 70, 30 20, 50 50 C 70 20, 90 70, 50 90 Z" fill="url(#gVerd)" fill-opacity="0.6" />
    <path d="M 50 90 C 30 50, 50 10, 50 10 C 50 10, 70 50, 50 90 Z" fill="url(#gAI)" fill-opacity="0.8" />
    <text x="50" y="140" class="label">13. Loto Tecnológico</text>
  </g>

  <!-- 14. Manos Sosteniendo -->
  <g transform="translate(900, 680)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 10 60 C 30 80, 50 90, 50 90 C 50 90, 70 80, 90 60" fill="none" stroke="url(#gVerd)" stroke-width="10" stroke-linecap="round" />
    <circle cx="50" cy="40" r="16" fill="url(#gInsight)" />
    <text x="50" y="140" class="label">14. Soporte / Guía</text>
  </g>

  <!-- 15. Hexágono IA -->
  <g transform="translate(1150, 680)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="url(#gAI)" stroke-width="6" />
    <path d="M 50 10 L 50 50 L 90 70" fill="none" stroke="url(#gFusion)" stroke-width="8" stroke-linecap="round" />
    <text x="50" y="140" class="label">15. Estructura</text>
  </g>

  <!-- FILA 4 -->
  <!-- 16. Cinta Möbius -->
  <g transform="translate(150, 920)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 20 50 C 20 20, 80 80, 80 50 C 80 20, 20 80, 20 50" fill="none" stroke="url(#gInsight)" stroke-width="12" stroke-linecap="round" />
    <text x="50" y="140" class="label">16. Proceso Continuo</text>
  </g>

  <!-- 17. V Dimensional -->
  <g transform="translate(400, 920)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 20 20 L 50 80 L 80 20" fill="none" stroke="url(#gMind)" stroke-width="16" stroke-linejoin="miter" />
    <path d="M 40 20 L 50 80" stroke="#FFFFFF" stroke-width="4" />
    <text x="50" y="140" class="label">17. V Isométrica</text>
  </g>

  <!-- 18. Sol Naciente V -->
  <g transform="translate(650, 920)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 10 30 L 50 90 L 90 30" fill="none" stroke="url(#gVerd)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="45" r="16" fill="url(#gInsight)" />
    <text x="50" y="140" class="label">18. Amanecer Clínico</text>
  </g>

  <!-- 19. Prisma -->
  <g transform="translate(900, 920)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <path d="M 50 10 L 90 80 L 10 80 Z" fill="none" stroke="url(#gAI)" stroke-width="8" stroke-linejoin="round" />
    <path d="M 50 10 L 50 55 L 90 80" fill="none" stroke="url(#gMind)" stroke-width="8" stroke-linejoin="round" />
    <text x="50" y="140" class="label">19. Múltiples Ángulos</text>
  </g>

  <!-- 20. V Minimalista -->
  <g transform="translate(1150, 920)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <g transform="translate(50, 50) scale(0.24) translate(-257.5, -287)">
      <path d="M100 250 L235 407 L415 167" fill="none" stroke="url(#brandGradient45)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="415" cy="167" r="20" fill="#FFFFFF" />
    </g>
    <text x="50" y="140" class="label">20. V Minimalista</text>
  </g>

  <!-- FILA 5 -->
  <!-- 21. V Fusionado -->
  <g transform="translate(525, 1160)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <g transform="translate(50, 50) scale(0.24) translate(-256, -265.5)">
      <path d="M100 196 L220 388 L412 124" fill="none" stroke="url(#brandGradient45)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="412" cy="124" r="20" fill="#FFFFFF" />
    </g>
    <text x="50" y="140" class="label">21. V Fusionado</text>
  </g>

  <!-- 22. V Verde -->
  <g transform="translate(775, 1160)">
    <rect x="-50" y="-10" width="200" height="170" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />
    <g transform="translate(50, 50) scale(0.24) translate(-256, -265.5)">
      <path d="M100 196 L220 388 L412 124" fill="none" stroke="url(#brandGradient0)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="412" cy="124" r="20" fill="#FFFFFF" />
    </g>
    <text x="50" y="140" class="label">22. V Verde</text>
  </g>
</svg>